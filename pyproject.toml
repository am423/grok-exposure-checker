[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-exposure-checker"
version = "3.0.0"
description = "Detects whether the Grok Build CLI uploaded your data to xAI's servers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
# Development-only tooling. The tool itself has zero runtime dependencies.
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
